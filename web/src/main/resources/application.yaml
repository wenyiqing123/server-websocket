app:
  # 对外服务地址；生产环境请覆盖为 HTTPS 公网地址。
  domain: "${APP_DOMAIN:http://localhost:8000}"
  # 可通过 APP_ENV 切换运行环境；敏感配置统一从 .env 或部署环境注入。
  environment: "${APP_ENV:development}"
  messaging:
    local-message:
      # 本地消息表投递开关；关闭后消息仍会落库，可在恢复 RabbitMQ 后重新开启。
      dispatch-enabled: "${LOCAL_MESSAGE_DISPATCH_ENABLED:true}"
      fixed-delay-ms: "${LOCAL_MESSAGE_FIXED_DELAY_MS:1000}"
      initial-delay-ms: "${LOCAL_MESSAGE_INITIAL_DELAY_MS:3000}"
      batch-size: "${LOCAL_MESSAGE_BATCH_SIZE:100}"
    # 生产者确认、NACK、网络异常和 mandatory return 都会回写本地消息表，
    # 按指数退避继续投递，避免 RabbitMQ 故障时高频重试。
    producer:
      retry:
        initial-delay-ms: "${RABBIT_PRODUCER_RETRY_INITIAL_DELAY_MS:1000}"
        multiplier: "${RABBIT_PRODUCER_RETRY_MULTIPLIER:2.0}"
        max-delay-ms: "${RABBIT_PRODUCER_RETRY_MAX_DELAY_MS:60000}"
    # 业务消费者失败后最多尝试 3 次，之后由恢复器投递到 error exchange。
    consumer:
      retry:
        max-attempts: "${RABBIT_CONSUMER_RETRY_MAX_ATTEMPTS:3}"
        initial-interval-ms: "${RABBIT_CONSUMER_RETRY_INITIAL_INTERVAL_MS:1000}"
        multiplier: "${RABBIT_CONSUMER_RETRY_MULTIPLIER:2.0}"
        max-interval-ms: "${RABBIT_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}"
    # 错误告警邮件失败时也做有限重试，最终记录日志并确认该错误消息。
    error-consumer:
      alert-email: "${RABBIT_ERROR_ALERT_EMAIL:2402317148@qq.com}"
      retry:
        max-attempts: "${RABBIT_ERROR_CONSUMER_RETRY_MAX_ATTEMPTS:3}"
        initial-interval-ms: "${RABBIT_ERROR_CONSUMER_RETRY_INITIAL_INTERVAL_MS:2000}"
        multiplier: "${RABBIT_ERROR_CONSUMER_RETRY_MULTIPLIER:2.0}"
        max-interval-ms: "${RABBIT_ERROR_CONSUMER_RETRY_MAX_INTERVAL_MS:30000}"
    # 到期检查的充值时间块可由环境变量覆盖，例如 10,20,30（单位：秒）。
    # 未覆盖时按 sys_config.recharge_close_minutes 自动切成 1:2:3 三段。
    expiry:
      recharge-delay-seconds: "${RABBIT_RECHARGE_EXPIRY_DELAY_SECONDS:}"

# JWT_SECRET 必须由 .env 或部署环境注入，禁止在配置文件中保留固定密钥。
security:
  jwt:
    secret: "${JWT_SECRET:}"

spring:
  # Spring Boot 原生加载项目根目录 .env；从 web 模块目录启动时兼容上一级目录。
  # 操作系统环境变量优先级更高，可在生产环境直接由 Secret 注入覆盖本地文件。
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  application:
    name: server-websocket
  # Spring 的 multipart 限制必须位于 spring.servlet 下；具体业务上限由 sys_config
  # 的 rag_max_upload_bytes / file_max_upload_bytes 再按接口动态校验。
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  cloud:
    sentinel:
      transport:
        dashboard: "${SENTINEL_DASHBOARD:localhost:8090}"
        port: ${SENTINEL_PORT:8719}
  mail:
    # 邮件服务凭据必须由环境变量或外部配置中心提供。
    host: "${MAIL_HOST:smtp.qq.com}"
    port: ${MAIL_PORT:465}
    username: "${MAIL_USERNAME:2402317148@qq.com}"
    password: "${MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  rabbitmq:
    # localhost/websocket 仅作为未暴露到公网的本地开发默认值；生产环境必须覆盖。
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: "${RABBITMQ_USERNAME:}"
    password: "${RABBITMQ_PASSWORD:}"
    virtual-host: "${RABBITMQ_VIRTUAL_HOST:/websocket}"
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      # mandatory=true 才会触发 returned callback，捕获没有绑定队列的消息。
      mandatory: true
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1
        acknowledge-mode: auto
        # 失败消息由监听器工厂的重试恢复器转发到 error exchange。
        default-requeue-rejected: false
  web:
    resources:
      static-locations:
        - file:${user.dir}/upload/
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sessionVariables=sql_mode='ANSI_QUOTES'}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

    # 🌟 删除了无效的 hikari，直接配置 druid，且与 url, username 平级
    # http://localhost:8000/druid/sql.html
    druid:
      # 连接池基础性能配置（替代你原来的 hikari 参数）
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

      # 监控与慢 SQL 配置
      filter:
        stat:
          # Druid Starter 默认不创建 StatFilter；必须显式启用，SQL 统计页才会有数据。
          enabled: true
          db-type: mysql
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true

      # Web 监控面板
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: "${DRUID_CONSOLE_USERNAME:admin}"
        login-password: "${DRUID_CONSOLE_PASSWORD:}"
        allow: ''
  data:
    redis:
      database: ${REDIS_DATABASE:1}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"
      timeout: "${REDIS_TIMEOUT:6000ms}"
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms
  ai:
    openai:
      # 使用阿里云百炼 OpenAI 兼容接口；密钥不能提交到仓库。
      api-key: "${DASHSCOPE_API_KEY:}"
      base-url: "${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}"
      chat:
        options:
          model: qwen3.8-max-0902
          temperature: 0.7
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
    chat:
      memory:
        jdbc:
          initialize-schema: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: cn.wyq.serverwebsocket.pojo.entity,cn.wyq.serverwebsocket.socket.pojo

logging:
  config: classpath:log4j2_dev.xml
  pattern:
    console: '%clr(%d{yyyyMMdd HH:mm:ss}){yellow} [%clr(%thread){red}] %-5level --- %clr(%logger){blue} | %msg%n'

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
  port: ${SERVER_PORT:8000}

image:
  mapping: /file/
  location: "${IMAGE_LOCATION:${user.dir}/upload/}"

# AI 文档与普通 /file/** 上传分开保存；留空时服务使用 ${user.dir}/private-ai-documents。
ai:
  document:
    storage:
      location: "${AI_DOCUMENT_STORAGE_LOCATION:}"
    limits:
      # Spring multipart 只提供 1GB 的静态安全上限；服务层会按数据库配置再次校验。
      max-file-size-bytes: 10485760
      # 在 Spring AI 完整读取 PDF 前限制页数，避免小体积但高页数的 PDF 消耗过多内存。
      max-pdf-pages: 100
      # PDF/TXT/Markdown 提取出的文本总量与向量切片数量上限。
      max-extracted-characters: 200000
      max-slices: 400

alipay:
  # 支付宝沙箱或生产凭据必须由部署环境注入，不能保存在仓库中。
  app-id: "${ALIPAY_APP_ID:}"
  private-key: "${ALIPAY_PRIVATE_KEY:}"
  alipay-public-key: "${ALIPAY_PUBLIC_KEY:}"
  gateway-url: "${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}"
  sign-type: RSA2
  charset: UTF-8
  format: json
  notify-url: "${ALIPAY_NOTIFY_URL:}"
