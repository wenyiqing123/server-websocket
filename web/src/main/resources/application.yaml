app:
  # 对外服务地址；生产环境请覆盖为 HTTPS 公网地址。
  domain: "${APP_DOMAIN:http://localhost:8000}"
  # 可通过 APP_ENV 切换运行环境；JWT_SECRET 未注入时使用下方固定开发密钥。
  environment: "${APP_ENV:development}"

# JWT_SECRET 可由部署环境覆盖；未配置时使用固定默认值，保证本地启动即可完成 JWT 初始化。
security:
  jwt:
    secret: "${JWT_SECRET:jwt_secret_for_server_websocket}"

spring:
  application:
    name: server-websocket
  # Spring 的 multipart 限制必须位于 spring.servlet 下；具体业务上限由 sys_config
  # 的 rag_max_upload_bytes / file_max_upload_bytes 再按接口动态校验。
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  cloud:
    sentinel:
      transport:
        dashboard: "${SENTINEL_DASHBOARD:localhost:8090}"
        port: ${SENTINEL_PORT:8719}
  mail:
    # 邮件服务凭据必须由环境变量或外部配置中心提供。
    host: "${MAIL_HOST:smtp.qq.com}"
    port: ${MAIL_PORT:465}
    username: "${MAIL_USERNAME:2402317148@qq.com}"
    password: "${MAIL_PASSWORD:gfhmjyhutnhrdieh}"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  rabbitmq:
    # localhost/websocket 仅作为未暴露到公网的本地开发默认值；生产环境必须覆盖。
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:websocket}
    password: ${RABBITMQ_PASSWORD:websocket}
    virtual-host: /websocket
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1
        acknowledge-mode: auto
  web:
    resources:
      static-locations:
        - file:${user.dir}/upload/
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    # 本地默认值不含密码；生产环境应使用权限最小化的专用数据库账户。
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sessionVariables=sql_mode='ANSI_QUOTES'}"
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:yq040809}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 120000
      idle-timeout: 60000
      keepalive-time: 30000
  data:
    redis:
      database: ${REDIS_DATABASE:1}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"
      timeout: "${REDIS_TIMEOUT:6000ms}"
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
  ai:
    openai:
      # 使用阿里云百炼 OpenAI 兼容接口；密钥不能提交到仓库。
      api-key: "${DASHSCOPE_API_KEY:sk-ws-H.PMPYMRX.iWOs.MEUCIQCYypOzo4Q4bFSVam8quwBCS2YIgDav5KgCuliFRo2hYAIgWdkrf5iCZEkWjG_0Xg7L8puVbATgeX1kYlb_XAqgFN0}"
      base-url: "${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}"
      chat:
        options:
          model: qwen3.8-max-0902
          temperature: 0.7
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
    chat:
      memory:
        jdbc:
          initialize-schema: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: cn.wyq.serverwebsocket.pojo.entity,cn.wyq.serverwebsocket.socket.pojo

logging:
  config: classpath:log4j2_dev.xml
  pattern:
    console: '%clr(%d{yyyyMMdd HH:mm:ss}){yellow} [%clr(%thread){red}] %-5level --- %clr(%logger){blue} | %msg%n'

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
  port: ${SERVER_PORT:8000}

image:
  mapping: /file/
  location: "${IMAGE_LOCATION:${user.dir}/upload/}"

# AI 文档与普通 /file/** 上传分开保存；留空时服务使用 ${user.dir}/private-ai-documents。
ai:
  document:
    storage:
      location: "${AI_DOCUMENT_STORAGE_LOCATION:}"
    limits:
      # Spring multipart 只提供 1GB 的静态安全上限；服务层会按数据库配置再次校验。
      max-file-size-bytes: 10485760
      # 在 Spring AI 完整读取 PDF 前限制页数，避免小体积但高页数的 PDF 消耗过多内存。
      max-pdf-pages: 100
      # PDF/TXT/Markdown 提取出的文本总量与向量切片数量上限。
      max-extracted-characters: 200000
      max-slices: 400

alipay:
  # 支付宝沙箱或生产凭据必须由部署环境注入，不能保存在仓库中。
  app-id: "${ALIPAY_APP_ID:9021000163616415}"
  private-key: "${ALIPAY_PRIVATE_KEY:}"
  alipay-public-key: "${ALIPAY_PUBLIC_KEY:}"
  gateway-url: "${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}"
  sign-type: RSA2
  charset: UTF-8
  format: json
  notify-url: "${ALIPAY_NOTIFY_URL:https://49ae2e51.r3.cpolar.top/alipay/notify}"
