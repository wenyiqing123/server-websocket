spring:
  application:
    name: server-websocket
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090 # 控制台地址
        port: 8719 # 客户端监控端口（如果被占用会自动+1扫描）
  mail:
    host: smtp.qq.com
    port: 465
    username: 2402317148@qq.com
    password: gfhmjyhutnhrdieh
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 3
        max-concurrency: 10
        prefetch: 1
        acknowledge-mode: auto
  web:
    resources:
      static-locations:
        - file:${user.dir}/upload/

  # 🌟 修复缩进：mvc 必须在 spring 下面，往左退 2 格
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 🌟 修复缩进：datasource 必须在 spring 下面，往左退 2 格
  datasource:
    url: jdbc:mysql://localhost:3306/chat?useSSL=false&serverTimezone=UTC&sessionVariables=sql_mode='ANSI_QUOTES'
    username: root
    password: yq040809
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 🌟 修复缩进：data (Redis) 必须在 spring 下面，往左退 2 格
  data:
    redis:
      database: 1      # 💡 注意：你用的是 1 号数据库
      host: localhost
      port: 6379
      password:
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
#  main:
#    # 🌟 新增这一行：允许我们自定义的 chatMemory 覆盖掉官方默认的
#    allow-bean-definition-overriding: true
  ai:
    openai:
      # 🌟 填入你从百炼控制台获取的 API Key
      api-key: ${DASHSCOPE_API_KEY:sk-5fe3023e1e5643469ba7f17b32efc864}

      # 🌟 关键：这里去掉末尾的 /v1，Spring AI 会自动补全
      base-url: https://dashscope.aliyuncs.com/compatible-mode

      # 🧠 聊天模型配置 (建议使用 qwen-max 或 qwen-plus)
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

      # 📏 向量化模型配置 (百炼兼容版)
      embedding:
        enabled: true
        options:
          model: text-embedding-v3 # 阿里云最强的向量模型

    # --------------------------------
    # 🌟 2. Ollama 向量化配置 (专职做文档切块嵌入)
    # --------------------------------
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        enabled: false # 关闭它的聊天功能，让 GPT-4o 专心干活
#      embedding:
#        enabled: true
#        options:
#          model: nomic-embed-text # 用于 RAG 的嵌入模型

    # --------------------------------
    # 🌟 3. 开启基于 JDBC 的聊天记忆库表自动创建
    # --------------------------------
    chat:
      memory:
        jdbc:
          initialize-schema: false # 第一次启动会在 MySQL 自动建记忆表


#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        options:
#          # 🚨 核心：这里填入你在 Ollama 中拉取好的模型名称
#          # 比如：llama3, qwen2.5:7b, deepseek-r1:1.5b
#          model: qwen2.5:3b
#          # 可选配置：控制模型回答的创造性，0 比较严谨，1 比较天马行空
#          temperature: 0.7
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: cn.wyq.serverwebsocket.pojo.entity,cn.wyq.serverwebsocket.socket.pojo

logging:
  config: classpath:log4j2_dev.xml
  pattern:
    console: '%clr(%d{yyyyMMdd HH:mm:ss}){yellow} [%clr(%thread){red}] %-5level --- %clr(%logger){blue} | %msg%n'

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  port: 8000

# 🌟 修复跨平台路径
image:
  mapping: /file/
  location: ${user.dir}/upload/